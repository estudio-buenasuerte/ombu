name: ombu
options:
  bundleIdPrefix: com.buenasuerte
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # A personal build: signed with the development certificate so the
    # hardened runtime accepts the helper, never notarized.
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 8WA5YWTZ2F
    OTHER_LDFLAGS: -lstdc++
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
targets:
  ombu:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: Vendor/GhosttyResources/terminfo
        type: folder
      - path: Vendor/GhosttyResources/ghostty
        type: folder
      - path: Resources/shell-integration
        type: folder
      - path: Resources/agents
        type: folder
    dependencies:
      - target: ombu-helper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: $(OMBU_DISPLAY_NAME)
        CFBundleDisplayName: $(OMBU_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        # Programs run inside Ombú are attributed to Ombú by macOS, so their
        # permission prompts show these.
        NSAppleEventsUsageDescription: A program running in Ombú would like to use AppleScript.
        NSBluetoothAlwaysUsageDescription: A program running in Ombú would like to use Bluetooth.
        NSCalendarsUsageDescription: A program running in Ombú would like to access your calendars.
        NSCameraUsageDescription: A program running in Ombú would like to use the camera.
        NSContactsUsageDescription: A program running in Ombú would like to access your contacts.
        NSLocalNetworkUsageDescription: A program running in Ombú would like to access the local network.
        NSLocationUsageDescription: A program running in Ombú would like to access your location.
        NSMicrophoneUsageDescription: A program running in Ombú would like to use the microphone.
        NSMotionUsageDescription: A program running in Ombú would like to access motion data.
        NSPhotoLibraryUsageDescription: A program running in Ombú would like to access your photos.
        NSRemindersUsageDescription: A program running in Ombú would like to access your reminders.
        NSSpeechRecognitionUsageDescription: A program running in Ombú would like to use speech recognition.
        NSSystemAdministrationUsageDescription: A program running in Ombú requires administrator privileges.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folders
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.directory]
        NSServices:
          - NSMenuItem:
              default: New Ombú Workspace Here
            NSMessage: openWorkspace
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes: [NSFilenamesPboardType, public.plain-text]
          - NSMenuItem:
              default: New Ombú Window Here
            NSMessage: openWindow
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes: [NSFilenamesPboardType, public.plain-text]
    settings:
      base:
        PRODUCT_NAME: Ombu
        # Placeholders; the stamp-version script writes the real values from git.
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: "0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.buenasuerte.ombu
        OMBU_DISPLAY_NAME: Ombú
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/Ombu.entitlements
      configs:
        Debug:
          # A debug build running beside an installed Ombú is a separate app
          # to macOS, so neither steals the other's activation or Dock entry.
          PRODUCT_BUNDLE_IDENTIFIER: com.buenasuerte.ombu.debug
          OMBU_DISPLAY_NAME: Ombú Debug
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/scripts/stamp-version.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - ombuTests
  ombu-helper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tools/ombu-helper
      - path: Sources/Agent/Shared
    settings:
      base:
        PRODUCT_NAME: ombu-helper
        PRODUCT_BUNDLE_IDENTIFIER: com.buenasuerte.ombu.helper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  ombuTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: ombu-helper
        embed: false
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    sources:
      - path: Tests
      - path: Sources/Logger.swift
      - path: Sources/AppFolder.swift
      - path: Sources/UI/CommandPalette.swift
      - path: Sources/UI/CommandPaletteView.swift
      - path: Sources/Workspace/PaneTree.swift
      - path: Sources/Workspace/Workspace.swift
      - path: Sources/Workspace/Session.swift
      - path: Sources/Workspace/TerminalModel.swift
      - path: Sources/Workspace/TabProcess.swift
      - path: Sources/Agent
      - path: Sources/Workspace/GitStatus.swift
      - path: Sources/Settings/Preferences.swift
      - path: Sources/Ghostty
      - path: Sources/ServiceProvider.swift
      - path: Sources/UI/ClipboardConfirmation.swift
      - path: Sources/UI/UntrustedLinkAlert.swift
      - path: Sources/UI/LinkPreviewView.swift
      - path: Sources/UI/SearchBarView.swift
      - path: Sources/UI/PaneTreeView.swift
      - path: Sources/UI/TerminalScrollbar.swift
      - path: Sources/UI/WindowContentViewController.swift
      - path: Sources/UI/WorkspaceMenu.swift
      - path: Sources/UI/RowDrop.swift
      - path: Sources/UI/Theme.swift
      - path: Sources/UI/AgentDotView.swift
      - path: Sources/UI/KeyboardShortcuts.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buenasuerte.ombuTests
        GENERATE_INFOPLIST_FILE: YES
